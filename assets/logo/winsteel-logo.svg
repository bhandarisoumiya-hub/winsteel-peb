<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background transparent or white -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0067B1" />
      <stop offset="100%" stop-color="#004B87" />
    </linearGradient>
  </defs>

  <!-- Blue W wings -->
  <polygon points="150,140 215,190 200,215 130,165" fill="#0067B1" />
  <polygon points="350,140 285,190 300,215 370,165" fill="#0067B1" />

  <!-- Yellow Chevrons / Crest -->
  <!-- Top chevron -->
  <polygon points="250,110 295,155 275,175 250,150 225,175 205,155" fill="#FFC400" />
  <!-- Middle chevron -->
  <polygon points="250,160 305,215 285,235 250,200 215,235 195,215" fill="#FFC400" />
  <!-- Bottom triangle accent -->
  <polygon points="250,208 268,226 232,226" fill="#FFC400" />

  <!-- Registered Mark -->
  <circle cx="455" cy="205" r="16" fill="none" stroke="#0067B1" stroke-width="4" />
  <text x="455" y="212" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="bold" fill="#0067B1" text-anchor="middle">R</text>

  <!-- Brand Typography -->
  <!-- Winsteel -->
  <text x="250" y="320" font-family="'Montserrat', 'Inter', 'Segoe UI', Arial, sans-serif" font-size="88" font-weight="900" fill="#0067B1" text-anchor="middle" letter-spacing="-1">Winsteel</text>

  <!-- Engineering Works Pvt. Ltd. -->
  <text x="250" y="360" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="23.5" font-weight="700" fill="#004B87" text-anchor="middle" letter-spacing="0.5">Engineering Works Pvt. Ltd.</text>

  <!-- Tagline Badge -->
  <rect x="95" y="380" width="310" height="36" rx="4" fill="#FFC400" />
  <text x="250" y="405" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="800" font-style="italic" fill="#004B87" text-anchor="middle" letter-spacing="0.5">Forming The Future</text>
</svg>
